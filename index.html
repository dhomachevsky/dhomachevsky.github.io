<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Andrii Domachevskyi | Portfolio</title>

    <meta name="description" content="Portfolio of 2D Game Artist Andrii Domachevskyi">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="hero">

        <div class="hero__media">

            <video class="hero__video" autoplay muted loop playsinline>

                <source src="images/hero/banner.mp4" type="video/mp4">

            </video>

            <div class="hero__overlay"></div>

        </div>

        <div class="hero__profile container">

            <div class="hero__avatar">

                <div class="hero__avatar-frame">

                    <img src="images/profile/avatar.webp" alt="Andrii Domachevskyi">

                </div>

            </div>

            <div class="hero__content">

                <h1 class="hero__title">
                    Andrii Domachevskyi
                </h1>

                <p class="hero__subtitle">
                    2D Game Artist
                </p>

            </div>

        </div>

    </header>

    <main class="main">

        <section class="content">

            <div class="container">

                <nav class="tabs" aria-label="Portfolio navigation">

                    <button class="tabs__button tabs__button--active" aria-selected="true">

                        Portfolio

                    </button>

                    <button class="tabs__button" aria-selected="false">

                        Resume

                    </button>

                </nav>

                <section class="portfolio">

                    <div class="portfolio__grid"></div>

                </section>

                <section class="resume" hidden>

                </section>

            </div>

            <div class="lightbox" hidden>

                <div class="lightbox__backdrop"></div>

                <div class="lightbox__dialog" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">

                    <button class="lightbox__close" aria-label="Close">

                        ×

                    </button>

                    <img class="lightbox__image" src="" alt="">

                    <div class="lightbox__content">

                        <h2 class="lightbox__title" id="lightbox-title">

                        </h2>

                        <p class="lightbox__category">

                        </p>

                        <p class="lightbox__description">

                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer class="footer"></footer>

    <script type="module" src="js/main.js"></script>

</body>

</html>
